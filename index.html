<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>我的桌宠</title>
  <style>
    #pet-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 9999;
  pointer-events: none; /* 平时鼠标穿透 */
}
  </style>
</head>
<body>
  <div id="pet-container"></div>
  
  <script type="module">
import { configure, createMascot } from "https://cdnjs.cloudflare.com/ajax/libs/web-mascot/1.0.0/index.js";
    configure({ assets: "https://cdnjs.cloudflare.com/ajax/libs/web-mascot/1.0.0/mascot_pack" });
    const [neuron, eviling] = await Promise.all([
      createMascot({ container: document.getElementById("pet-container"), pack: "Neuron" }),
      createMascot({ container: document.getElementById("pet-container"), pack: "Eviling" })
    ]);
    
  </script>
</body>
</html>
